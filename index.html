<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalshi Desk">
<title>Kalshi Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { --bg:#000; --card:#141414; --line:#262626; --txt:#f2f2f2; --dim:#9a9a9a;
          --green:#30d158; --red:#ff453a; --amber:#ffd60a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
         padding:14px 14px 40px; max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 12px; }
  .brand { font-size:19px; font-weight:700; }
  .badge { font-size:11px; font-weight:700; color:#000; background:var(--amber); border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:2px;}
  .live-dot { font-size:12px; color:var(--dim); }
  .live-dot b { color:var(--green); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:8px; }
  .headline { font-size:19px; font-weight:600; line-height:1.4; }
  .detail { color:var(--dim); font-size:14px; margin-top:8px; line-height:1.55; }
  .detail b { color:var(--txt); }
  .spot { font-size:34px; font-weight:800; letter-spacing:-.5px; }
  canvas { width:100%; height:64px; display:block; margin-top:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .stat .v { font-size:19px; font-weight:700; }
  .stat .k { color:var(--dim); font-size:11.5px; margin-top:2px; line-height:1.35; }
  .bet { padding:10px 0; border-top:1px solid var(--line); }
  .bet:first-of-type { border-top:none; padding-top:2px; }
  .bet .what { font-size:15px; font-weight:600; line-height:1.35; }
  .bet .how { color:var(--dim); font-size:13px; margin-top:3px; line-height:1.5; }
  .bet .how b { color:var(--txt); font-weight:600; }
  .pill { font-size:11px; font-weight:700; border-radius:6px; padding:1px 6px; vertical-align:1px; }
  .pill.yes { background:#12351d; color:var(--green); } .pill.no { background:#3d1713; color:var(--red); }
  .pill.pass { background:#2a2a2a; color:var(--dim); } .pill.pick { background:#12351d; color:var(--green); }
  .note { color:var(--dim); font-size:12.5px; line-height:1.5; margin-top:8px; }
  .err { color:var(--red); font-size:14px; line-height:1.5; }
  footer { color:#555; font-size:12px; text-align:center; margin-top:18px; line-height:1.6; }
  .refresh { color:var(--dim); font-size:12px; text-align:right; }
  .up { color:var(--green); } .down { color:var(--red); }
</style>
</head>
<body>
<header>
  <div class="brand">Kalshi BTC Desk<span class="badge" id="modeBadge">PAPER</span></div>
  <div class="live-dot" id="liveDot">connecting…</div>
</header>

<div id="content">
  <div class="card"><div class="err" id="bootMsg">Loading desk state…</div></div>
</div>

<footer>Read-only. The desk never places real-money orders —<br>alerts only, you trade by hand on Kalshi.</footer>

<script>
(function () {
  "use strict";
  (function capturePath() {
    var m = location.hash.match(/#d=([A-Za-z0-9_-]+)/);
    if (m) { localStorage.setItem("desk_dp", m[1]);
             history.replaceState(null, "", location.pathname + location.search); }
  })();
  var DP = localStorage.getItem("desk_dp");
  var BASE = DP ? "d/" + DP + "/" : null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n) { return (n < 0 ? "-$" : "$") + Math.abs(Number(n || 0)).toFixed(2); }
  function dollars(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function pct(n) { return n == null ? "?" : Math.round(n * 100) + "%"; }
  function cents(p) { return p == null ? "—" : Math.round(p * 100) + "¢"; }
  function tLocal(iso) { try { return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); } catch (e) { return ""; } }

  /* ---- turn a raw ticker into plain English ---- */
  function marketWords(ticker, closeIso) {
    var when = closeIso ? " at " + tLocal(closeIso) : "";
    var m;
    if ((m = ticker.match(/^KXBTC15M-/))) return { what: "the 15-min round ending " + tLocal(closeIso), kind: "15m" };
    if ((m = ticker.match(/^KXBTCD-.*-T(\d+\.?\d*)/))) return { what: "BTC over " + dollars(parseFloat(m[1])) + when, kind: "above", strike: parseFloat(m[1]) };
    if ((m = ticker.match(/^KXBTC-.*-B(\d+\.?\d*)/))) { var f = parseFloat(m[1]);
      return { what: "BTC between " + dollars(f) + " and " + dollars(f + 100) + when, kind: "range", floor: f }; }
    return { what: ticker, kind: "?" };
  }
  function winWords(pos) {
    var w = marketWords(pos.ticker, pos.close_time);
    if (w.kind === "15m") return pos.side === "YES" ? "Wins if BTC ends the round UP" : "Wins if BTC ends the round DOWN";
    if (w.kind === "above") return pos.side === "YES" ? "Wins if " + w.what : "Wins if BTC is NOT over " + dollars(w.strike) + (pos.close_time ? " at " + tLocal(pos.close_time) : "");
    if (w.kind === "range") return pos.side === "YES" ? "Wins if " + w.what : "Wins if BTC ends OUTSIDE that range";
    return "";
  }

  function drawSpark(series) {
    var c = document.getElementById("spark"); if (!c || !series || series.length < 2) return;
    var dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    var x = c.getContext("2d"); x.scale(dpr, dpr);
    var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
    var pad = (max - min) * 0.15 || 1; min -= pad; max += pad;
    x.beginPath();
    series.forEach(function (v, i) {
      var px = (i / (series.length - 1)) * w, py = h - ((v - min) / (max - min)) * h;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    });
    var up = series[series.length - 1] >= series[0];
    x.strokeStyle = up ? "#30d158" : "#ff453a"; x.lineWidth = 2; x.stroke();
    x.lineTo(w, h); x.lineTo(0, h); x.closePath();
    x.fillStyle = up ? "rgba(48,209,88,.12)" : "rgba(255,69,58,.12)"; x.fill();
  }

  function render(s) {
    var el = document.getElementById("content");
    var pk = s.picker || {}, pp = s.paper || {}, ln = s.learning || {};
    var positions = s.positions || [];
    var inBets = positions.reduce(function (a, p) { return a + (p.total_debit || 0); }, 0);
    var html = "";

    /* 1 — the one-sentence story */
    html += '<div class="card"><h2>What the desk is doing</h2>' +
      '<div class="headline">' + esc(pk.summary || "Waiting for the next round.") + '</div>' +
      (s.target ? '<div class="detail">This round\'s target: <b>' + dollars(s.target.strike) + '</b>' +
        (s.target.distance != null ? ' — BTC is <b class="' + (s.target.distance >= 0 ? "up" : "down") + '">' +
          (s.target.distance >= 0 ? "+" : "−") + "$" + Math.abs(s.target.distance).toFixed(2) + '</b> ' +
          (s.target.distance >= 0 ? "above" : "below") + ' it right now' : "") + '</div>' : "") +
      '</div>';

    /* 2 — price */
    var series = s.spot_series || [];
    var chg = series.length > 1 ? s.spot - series[0] : 0;
    html += '<div class="card"><h2>Bitcoin price (desk feed)</h2>' +
      '<div class="spot">$' + Number(s.spot || 0).toLocaleString(undefined, {maximumFractionDigits: 0}) + '</div>' +
      '<div class="detail"><span class="' + (chg >= 0 ? "up" : "down") + '">' + (chg >= 0 ? "▲" : "▼") +
      ' $' + Math.abs(chg).toFixed(0) + '</span> in the last 2 hours</div>' +
      '<canvas id="spark"></canvas></div>';

    /* 3 — money, one clean row */
    html += '<div class="grid3">' +
      '<div class="card stat"><div class="v">' + money(pp.cash) + '</div><div class="k">Paper cash left</div></div>' +
      '<div class="card stat"><div class="v" style="color:' + ((pp.realized_pnl || 0) >= 0 ? "var(--green)" : "var(--red)") + '">' +
        money(pp.realized_pnl) + '</div><div class="k">Profit / loss so far</div></div>' +
      '<div class="card stat"><div class="v">' + money(inBets) + '</div><div class="k">In open bets (' + positions.length + ')</div></div>' +
      '</div>';

    /* 4 — open bets in plain English */
    if (positions.length) {
      var pickerBets = positions.filter(function (p) { return p.kind === "pick"; });
      var oldBets = positions.filter(function (p) { return p.kind !== "pick"; });
      function betList(list, title, note) {
        var h = '<div class="card"><h2>' + title + '</h2>';
        list.forEach(function (p) {
          var w = marketWords(p.ticker, p.close_time);
          h += '<div class="bet"><div class="what"><span class="pill ' + (p.side === "YES" ? "yes" : "no") + '">' + esc(p.side) + '</span> ' +
            esc(w.kind === "15m" ? "BTC " + (p.side === "YES" ? "UP" : "DOWN") + " — " + w.what : w.what) + '</div>' +
            '<div class="how">' + p.contracts + ' contracts @ ' + cents(p.vwap) + ' · cost <b>' + money(p.total_debit) + '</b> · ' +
            esc(winWords(p)) + ' · the model gave it <b>' + pct(p.fair) + '</b></div></div>';
        });
        if (note) h += '<div class="note">' + note + '</div>';
        return h + '</div>';
      }
      if (pickerBets.length) html += betList(pickerBets, "Open bets — the picker's");
      if (oldBets.length) html += betList(oldBets, "Open bets — earlier system",
        "These were placed by the earlier version of the desk (before the picker rebuild). They settle on their own; the picker isn't placing bets like these anymore.");
    }

    /* 5 — picker accuracy, kept separate on purpose */
    html += '<div class="card"><h2>Picker accuracy</h2>' +
      '<div class="headline" style="font-size:17px">Record: ' + esc(ln.record || "0-0") + ' · ' + (ln.settled || 0) + ' picks settled' +
      (ln.brier != null ? ' · Brier ' + ln.brier.toFixed(3) : "") + '</div>' +
      '<div class="note">This counts ONLY the new picker\'s 15-minute picks — not the older bets above, which is why it can show 0 settled while the profit/loss has already moved. Brier score: lower is better, 0.25 is coin-flip guessing.</div></div>';

    /* 6 — recent decisions */
    if ((s.decisions || []).length) {
      html += '<div class="card"><h2>Recent calls</h2>';
      s.decisions.forEach(function (d) {
        html += '<div class="bet"><div class="what" style="font-size:14px"><span class="pill ' + (d.type === "pick" ? "pick" : "pass") + '">' +
          (d.type === "pick" ? "PICK" : "PASS") + '</span> ' + esc(marketWords(d.ticker || "", null).what) + '</div>' +
          '<div class="how">' + esc(d.text || "") + ' · ' + tLocal(d.ts) + '</div></div>';
      });
      html += '</div>';
    }

    /* 7 — settled results */
    if ((s.settlements || []).length) {
      html += '<div class="card"><h2>Recent results</h2>';
      s.settlements.forEach(function (x) {
        html += '<div class="bet"><div class="what" style="font-size:14px">' + esc(marketWords(x.ticker, x.close_time).what) + '</div>' +
          '<div class="how">Result: <b>' + esc(x.result || "?") + '</b> · the bet ' + (x.won ? '<b class="up">won</b>' : '<b class="down">lost</b>') +
          ' · <b style="color:' + (x.pnl >= 0 ? "var(--green)" : "var(--red)") + '">' + money(x.pnl) + '</b></div></div>';
      });
      html += '</div>';
    }

    html += '<div class="refresh">Updated ' + tLocal(s.updated_at) + ' · refreshes every 15s</div>';
    el.innerHTML = html;
    drawSpark(series);
    document.getElementById("modeBadge").textContent = s.mode || "PAPER";
    document.getElementById("liveDot").innerHTML = "<b>●</b> live";
  }

  function load() {
    if (!BASE) {
      document.getElementById("bootMsg").textContent =
        "No desk key in this browser yet — open the full link Castiel sent you (the one with #d= in it) once.";
      return;
    }
    fetch(BASE + "state.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById("liveDot").innerHTML = '<span style="color:#ff453a">●</span> reconnecting…';
      });
  }
  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
