<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalshi Desk">
<title>Kalshi Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { --bg:#000; --card:#141414; --line:#262626; --txt:#f2f2f2; --dim:#9a9a9a;
          --green:#30d158; --red:#ff453a; --amber:#ffd60a; --blue:#0a84ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
         padding:14px 14px 40px; max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 12px; }
  .brand { font-size:19px; font-weight:700; letter-spacing:.2px; }
  .badge { font-size:11px; font-weight:700; color:#000; background:var(--amber); border-radius:6px; padding:2px 7px; vertical-align:2px; margin-left:8px;}
  .live-dot { font-size:12px; color:var(--dim); }
  .live-dot b { color:var(--green); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .spot { font-size:40px; font-weight:800; letter-spacing:-.5px; }
  .spot-sub { color:var(--dim); font-size:13px; margin-top:2px; }
  .up { color:var(--green); } .down { color:var(--red); }
  canvas { width:100%; height:74px; display:block; margin-top:10px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:8px; }
  .pick-summary { font-size:16px; line-height:1.45; }
  .pick-meta { color:var(--dim); font-size:13px; margin-top:6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat .v { font-size:21px; font-weight:700; }
  .stat .k { color:var(--dim); font-size:12px; margin-top:2px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  .row:first-of-type { border-top:none; }
  .row .r { text-align:right; white-space:nowrap; }
  .tk { font-weight:600; font-size:13px; }
  .sub { color:var(--dim); font-size:12px; margin-top:1px; }
  .pill { font-size:11px; font-weight:700; border-radius:6px; padding:1px 6px; }
  .pill.yes { background:#12351d; color:var(--green); } .pill.no { background:#3d1713; color:var(--red); }
  .pill.pass { background:#2a2a2a; color:var(--dim); } .pill.pick { background:#12351d; color:var(--green); }
  .err { color:var(--red); font-size:14px; line-height:1.5; }
  footer { color:#555; font-size:12px; text-align:center; margin-top:18px; line-height:1.6; }
  .refresh { color:var(--dim); font-size:12px; text-align:right; margin-top:4px;}
</style>
</head>
<body>
<header>
  <div class="brand">Kalshi BTC Desk<span class="badge" id="modeBadge">PAPER</span></div>
  <div class="live-dot" id="liveDot">connecting…</div>
</header>

<div id="content">
  <div class="card"><div class="err" id="bootMsg">Loading desk state…</div></div>
</div>

<footer>Read-only. The desk never places real-money orders —<br>alerts only, you trade by hand on Kalshi.</footer>

<script>
(function () {
  "use strict";
  /* Same data-path mechanism as the old desk page: the secret path arrives
     once in the #d= fragment, lives in localStorage under the SAME key the
     old page used (desk_dp), and is stripped from the address bar. */
  (function capturePath() {
    var m = location.hash.match(/#d=([A-Za-z0-9_-]+)/);
    if (m) { localStorage.setItem("desk_dp", m[1]);
             history.replaceState(null, "", location.pathname + location.search); }
  })();
  var DP = localStorage.getItem("desk_dp");
  var BASE = DP ? "d/" + DP + "/" : null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n) { return (n < 0 ? "-$" : "$") + Math.abs(Number(n)).toFixed(2); }
  function pct(n) { return n == null ? "n/a" : (n * 100).toFixed(1) + "%"; }
  function cents(p) { return p == null ? "—" : Math.round(p * 100) + "¢"; }
  function tLocal(iso) { try { return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); } catch (e) { return ""; } }

  function drawSpark(series) {
    var c = document.getElementById("spark"); if (!c || !series || series.length < 2) return;
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    var x = c.getContext("2d"); x.scale(dpr, dpr);
    var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
    var pad = (max - min) * 0.15 || 1; min -= pad; max += pad;
    x.beginPath();
    series.forEach(function (v, i) {
      var px = (i / (series.length - 1)) * w;
      var py = h - ((v - min) / (max - min)) * h;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    });
    var up = series[series.length - 1] >= series[0];
    x.strokeStyle = up ? "#30d158" : "#ff453a"; x.lineWidth = 2; x.stroke();
    x.lineTo(w, h); x.lineTo(0, h); x.closePath();
    x.fillStyle = up ? "rgba(48,209,88,.12)" : "rgba(255,69,58,.12)"; x.fill();
  }

  function render(s) {
    var el = document.getElementById("content");
    var series = s.spot_series || [];
    var chg = series.length > 1 ? s.spot - series[0] : 0;
    var pk = s.picker || {};
    var pp = s.paper || {};
    var ln = s.learning || {};
    var html = "";

    html += '<div class="card"><h2>Bitcoin spot (desk feed)</h2>' +
      '<div class="spot">$' + Number(s.spot || 0).toLocaleString(undefined, {maximumFractionDigits: 0}) + '</div>' +
      '<div class="spot-sub"><span class="' + (chg >= 0 ? "up" : "down") + '">' +
      (chg >= 0 ? "▲" : "▼") + " $" + Math.abs(chg).toFixed(0) + ' last 2h</span>' +
      ' · vol window ' + (s.vol_ticks || 0) + '/1800 ticks</div>' +
      '<canvas id="spark"></canvas></div>';

    html += '<div class="card"><h2>Current 15-min call</h2>' +
      '<div class="pick-summary">' + esc(pk.summary || "waiting for the next interval") + '</div>' +
      (pk.ticker ? '<div class="pick-meta">' + esc(pk.ticker) +
        (pk.close_time ? " · closes " + tLocal(pk.close_time) : "") + '</div>' : "") +
      (s.target ? '<div class="pick-meta" style="margin-top:8px;font-size:14px">Target: <b style="color:var(--txt)">$' +
        Number(s.target.strike).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</b>' +
        (s.target.distance != null ? ' · price is <b style="color:' + (s.target.distance >= 0 ? "var(--green)" : "var(--red)") + '">' +
          (s.target.distance >= 0 ? "$" : "-$") + Math.abs(s.target.distance).toFixed(2) + (s.target.distance >= 0 ? " above" : " below") + '</b> it' : "") + '</div>' : "") + '</div>';

    html += '<div class="grid">' +
      '<div class="card stat"><div class="v">' + money(pp.cash || 0) + '</div><div class="k">Paper cash</div></div>' +
      '<div class="card stat"><div class="v" style="color:' + ((pp.realized_pnl || 0) >= 0 ? "var(--green)" : "var(--red)") + '">' +
        money(pp.realized_pnl || 0) + '</div><div class="k">Realized P&amp;L</div></div>' +
      '<div class="card stat"><div class="v">' + esc(ln.record || "0-0") + '</div><div class="k">Picker record (W-L)</div></div>' +
      '<div class="card stat"><div class="v">' + (ln.brier == null ? "—" : ln.brier.toFixed(3)) + '</div><div class="k">Brier score · ' + (ln.settled || 0) + ' settled</div></div>' +
      '</div>';

    if ((s.positions || []).length) {
      html += '<div class="card"><h2>Open paper positions (' + s.positions.length + ')</h2>';
      s.positions.forEach(function (p) {
        html += '<div class="row"><div><span class="pill ' + (p.side === "YES" ? "yes" : "no") + '">' + esc(p.side) + '</span> ' +
          '<span class="tk">' + esc(p.ticker) + '</span><div class="sub">' + p.contracts + ' contracts · fair was ' + pct(p.fair) + '</div></div>' +
          '<div class="r">' + cents(p.vwap) + '<div class="sub">cost ' + money(p.total_debit) + '</div></div></div>';
      });
      html += '</div>';
    }

    if ((s.decisions || []).length) {
      html += '<div class="card"><h2>Recent decisions</h2>';
      s.decisions.forEach(function (d) {
        html += '<div class="row"><div><span class="pill ' + (d.type === "pick" ? "pick" : "pass") + '">' +
          (d.type === "pick" ? "PICK" : "PASS") + '</span> <span class="tk">' + esc(d.ticker || "") + '</span>' +
          '<div class="sub">' + esc(d.text || "") + '</div></div>' +
          '<div class="r"><div class="sub">' + tLocal(d.ts) + '</div></div></div>';
      });
      html += '</div>';
    }

    if ((s.settlements || []).length) {
      html += '<div class="card"><h2>Recent settlements</h2>';
      s.settlements.forEach(function (x) {
        html += '<div class="row"><div><span class="tk">' + esc(x.ticker) + '</span>' +
          '<div class="sub">result: ' + esc(x.result || "?") + ' · model said ' + pct(x.fair) + '</div></div>' +
          '<div class="r" style="color:' + (x.pnl >= 0 ? "var(--green)" : "var(--red)") + '">' + money(x.pnl || 0) + '</div></div>';
      });
      html += '</div>';
    }

    html += '<div class="refresh">Updated ' + tLocal(s.updated_at) + ' · refreshes every 15s</div>';
    el.innerHTML = html;
    drawSpark(series);
    document.getElementById("modeBadge").textContent = s.mode || "PAPER";
    document.getElementById("liveDot").innerHTML = "<b>●</b> live";
  }

  function load() {
    if (!BASE) {
      document.getElementById("bootMsg").textContent =
        "No desk key in this browser yet — open the full link Castiel sent you (the one with #d= in it) once.";
      return;
    }
    fetch(BASE + "state.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById("liveDot").innerHTML = '<span style="color:#ff453a">●</span> reconnecting…';
      });
  }
  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
