<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grok Bot">
<title>Grok Bot</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="avatarBtn" class="avatar" aria-label="Open account">G</button>
    <button id="brandBtn" class="brand">Grok Bot <span class="chev">›</span></button>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" aria-label="Search coins">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.8-3.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="bellBtn" class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6zm4 10a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="bellDot" class="bell-dot" hidden></span>
      </button>
    </div>
  </header>

  <div id="offlineBar" class="offline-bar" hidden></div>

  <main id="main">
    <!-- HOME -->
    <section id="view-home" class="view">
      <div class="balance-block">
        <div class="balance-label">Balance <span id="paperBadge" class="paper-badge" hidden>PAPER</span></div>
        <div id="balanceValue" class="balance-value skeleton-text">$—</div>
        <div class="balance-sub">
          <span id="todayPct" class="today-pct">—</span>
          <span id="multiplierPill" class="mult-pill" hidden>—</span>
          <span id="updatedAt" class="updated-at"></span>
        </div>
      </div>

      <div class="chart-card">
        <canvas id="homeChart" class="chart-canvas"></canvas>
        <div id="chartEmpty" class="chart-empty" hidden>
          <div class="dashed-line"></div>
          <div>Waiting for the first trade</div>
        </div>
        <div class="range-row" id="rangeRow" role="tablist" aria-label="Chart range">
          <button data-range="LIVE" class="range-btn active">LIVE</button>
          <button data-range="1H" class="range-btn">1H</button>
          <button data-range="4H" class="range-btn">4H</button>
          <button data-range="1D" class="range-btn">1D</button>
          <button data-range="1W" class="range-btn">1W</button>
          <button data-range="ALL" class="range-btn">ALL</button>
        </div>
      </div>

      <div class="section-head">
        <h2 id="agentsHeadline">Agents</h2>
        <span id="agentsRunning" class="section-note"></span>
      </div>
      <div id="agentCarousel" class="carousel" aria-label="Agent cards"></div>

      <div class="section-head">
        <h2>Activity</h2>
        <button id="seeAllActivity" class="link-btn">See all</button>
      </div>
      <div id="homeActivity" class="activity-list"></div>
    </section>

    <!-- AGENTS -->
    <section id="view-agents" class="view" hidden>
      <h1 class="view-title">Agents</h1>
      <div id="agentStack" class="agent-stack"></div>
    </section>

    <!-- ACTIVITY -->
    <section id="view-activity" class="view" hidden>
      <h1 class="view-title">Activity</h1>
      <div id="activityList" class="activity-list"></div>
    </section>

    <!-- ACCOUNT -->
    <section id="view-account" class="view" hidden>
      <h1 class="view-title">Account</h1>
      <div id="accountBody"></div>
    </section>
  </main>

  <!-- COIN SCREEN -->
  <section id="coinScreen" class="screen" hidden>
    <div class="screen-nav">
      <button class="back-btn" data-close-screen>‹ Back</button>
      <span id="coinPaperBadge" class="paper-badge" hidden>PAPER</span>
    </div>
    <div id="coinBody"></div>
  </section>

  <!-- AUDITOR SCREEN -->
  <section id="auditorScreen" class="screen" hidden>
    <div class="screen-nav">
      <button class="back-btn" data-close-screen>‹ Back</button>
      <span class="screen-title">Auditor</span>
    </div>
    <div id="auditorBody"></div>
  </section>

  <!-- SEARCH -->
  <section id="searchScreen" class="screen" hidden>
    <div class="screen-nav">
      <button class="back-btn" data-close-screen>‹ Back</button>
      <span class="screen-title">Search</span>
    </div>
    <input id="searchInput" class="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Name, symbol or mint address">
    <div id="searchResults" class="search-results"></div>
  </section>

  <nav id="tabbar" aria-label="Tabs">
    <button data-tab="home" class="tab active"><span class="tab-ic">⌂</span><span>Home</span></button>
    <button data-tab="agents" class="tab"><span class="tab-ic">◉</span><span>Agents</span></button>
    <button data-tab="activity" class="tab"><span class="tab-ic">☰</span><span>Activity</span></button>
    <button data-tab="account" class="tab"><span class="tab-ic">◐</span><span>Account</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
